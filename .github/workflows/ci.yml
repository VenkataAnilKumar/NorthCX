name: CI
on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env: { POSTGRES_USER: northcx, POSTGRES_PASSWORD: northcx, POSTGRES_DB: northcx_test }
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U northcx" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      NORTHCX_TEST_DATABASE_URL: postgresql+asyncpg://northcx:northcx@localhost:5432/northcx_test
      NORTHCX_REQUIRE_DB: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install --require-hashes -r src/backend/requirements-dev.lock && pip install --no-deps -e src/backend
      - run: python -m pytest -q
        working-directory: src/backend
      - name: Scenario simulations (required scenarios gate the build)
        run: >-
          python -m northcx.simulation examples/scenarios --specs examples --registry examples.support_agent:registry
          --skip-judge --record --source ci --meta commit=${{ github.sha }} --meta ref=${{ github.ref_name }}
        working-directory: src/backend
        env:
          NORTHCX_DATABASE_URL: postgresql://northcx:northcx@localhost:5432/northcx_test
  audit:
    # Known-vulnerability check on exactly what is pinned (the container image's runtime lock and the CI lock).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install pip-audit
      - run: pip-audit --require-hashes --disable-pip -r src/backend/requirements.lock
      - run: pip-audit --require-hashes --disable-pip -r src/backend/requirements-dev.lock
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "22" }
      - run: npm ci
        working-directory: src
      - run: npm run typecheck
        working-directory: src
      - run: npm test
        working-directory: src
      - run: npm run build
        working-directory: src
  sdk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "22" }
      - run: npm ci
        working-directory: src/sdk
      - run: npm test
        working-directory: src/sdk
      - run: npm run build
        working-directory: src/sdk
  prototype:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "22" }
      - run: npm ci
        working-directory: src/prototype
      - run: npm run typecheck
        working-directory: src/prototype
      - run: npm test
        working-directory: src/prototype
  provenance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/check_restricted_paths.py
  stack:
    # Builds the real images and starts the whole stack exactly as the README describes.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Write the configuration with the setup script (the same command the README gives)
        run: |
          echo "STARTED=$(date +%s)" >> "$GITHUB_ENV"
          python3 scripts/setup.py --demo --non-interactive
          KEY=$(grep '^NORTHCX_API_KEY=' .env | cut -d= -f2)
          echo "::add-mask::$KEY"
          echo "KEY=$KEY" >> "$GITHUB_ENV"
          echo 'NORTHCX_CORS_ORIGINS=http://localhost:8080' >> .env
      - run: docker compose up -d --build --wait --wait-timeout 300
      - name: Smoke test
        run: |
          curl --fail --silent http://127.0.0.1:3000/ready
          curl --fail --silent --output /dev/null http://127.0.0.1:3001/
          curl --fail --silent --output /dev/null http://127.0.0.1:3002/
          curl --fail --silent -H "authorization: Bearer $KEY" http://127.0.0.1:3002/api/northcx/v1/me | grep -q '"role":"admin"'
          for path in templates skills routing trace-export regression monitor/summary agents/support/environments; do
            curl --fail --silent --output /dev/null -H "authorization: Bearer $KEY" "http://127.0.0.1:3000/v1/$path" || { echo "FAILED: /v1/$path"; exit 1; }
          done
          curl --fail --silent --output /dev/null -H "authorization: Bearer $KEY" -H 'content-type: application/json' \
            -d '{"sessionId":"ci","message":"where is order 1042?"}' http://127.0.0.1:3000/v1/agents/support/chat
          test "$(curl --silent --output /dev/null --write-out '%{http_code}' http://127.0.0.1:3000/v1/agents)" = "401"
          curl --fail --silent -H "authorization: Bearer $KEY" http://127.0.0.1:3001/api/northcx/v1/me | grep -q '"role":"admin"'
          curl --fail --silent -X POST -H "authorization: Bearer $KEY" -H 'content-type: application/json' \
            -d '{"sessionId":"ci","message":"where is order 1042?"}' http://127.0.0.1:3000/v1/agents/support/chat | grep -q delivered
      - name: Time from the setup script to the first answer
        run: |
          echo "Seconds from running scripts/setup.py to the first answer, building the images on a hosted runner: $(( $(date +%s) - STARTED ))" | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Backup and restore drill (the real stack)
        run: |
          mkdir backups
          RUN="docker compose run --rm --user root -v $PWD/backups:/backups backend python -m northcx"
          $RUN backup --out /backups/ci.backup | tee backup.log
          grep -q "Backed up" backup.log
          # something that happens after the backup must be gone after the restore, and the conversation from before it must be there
          curl --fail --silent --output /dev/null -H "authorization: Bearer $KEY" -H 'content-type: application/json' \
            -d '{"sessionId":"after-backup","message":"hello"}' http://127.0.0.1:3000/v1/agents/support/chat
          $RUN restore /backups/ci.backup --replace | tee restore.log
          grep -q "Restored" restore.log
          docker compose restart backend
          for i in $(seq 1 30); do curl --fail --silent http://127.0.0.1:3000/ready >/dev/null && break; sleep 2; done
          curl --fail --silent -H "authorization: Bearer $KEY" http://127.0.0.1:3000/v1/sessions/ci/transcript | grep -q "order 1042"
          test "$(curl --silent --output /dev/null --write-out '%{http_code}' -H "authorization: Bearer $KEY" http://127.0.0.1:3000/v1/sessions/after-backup/transcript)" = "404"
      - uses: actions/setup-node@v4
        with: { node-version: "22" }
      - name: Browser tests (Studio, Workspace and the chat widget, in a real browser, against this stack)
        run: |
          npm ci
          npx playwright install --with-deps chromium
          API_KEY="$KEY" node apps/studio/e2e/smoke.mjs
          API_KEY="$KEY" node apps/workspace/e2e/smoke.mjs
          API_URL=http://127.0.0.1:3000 ADMIN_KEY="$KEY" node sdk/e2e/smoke.mjs
        working-directory: src
      - if: failure()
        run: docker compose logs --no-color
      - if: always()
        run: docker compose down -v

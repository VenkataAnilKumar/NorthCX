name: CI
on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env: { POSTGRES_USER: northcx, POSTGRES_PASSWORD: northcx, POSTGRES_DB: northcx_test }
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U northcx" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      NORTHCX_TEST_DATABASE_URL: postgresql+asyncpg://northcx:northcx@localhost:5432/northcx_test
      NORTHCX_REQUIRE_DB: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -e "src/backend[dev]"
      - run: python -m pytest -q
        working-directory: src/backend
      - name: Scenario simulations (required scenarios gate the build)
        run: python -m northcx.simulation examples/scenarios --specs examples --registry examples.support_agent:registry --skip-judge
        working-directory: src/backend
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "22" }
      - run: npm ci
        working-directory: src/web
      - run: npm run typecheck
        working-directory: src/web
      - run: npm test
        working-directory: src/web
      - run: npm run build
        working-directory: src/web
  prototype:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "22" }
      - run: npm ci
        working-directory: src/prototype
      - run: npm run typecheck
        working-directory: src/prototype
      - run: npm test
        working-directory: src/prototype
  provenance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/check_restricted_paths.py

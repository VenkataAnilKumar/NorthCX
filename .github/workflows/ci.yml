name: CI
on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env: { POSTGRES_USER: northcx, POSTGRES_PASSWORD: northcx, POSTGRES_DB: northcx_test }
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U northcx" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      NORTHCX_TEST_DATABASE_URL: postgresql+asyncpg://northcx:northcx@localhost:5432/northcx_test
      NORTHCX_REQUIRE_DB: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -e "src/backend[dev]"
      - run: python -m pytest -q
        working-directory: src/backend
      - name: Scenario simulations (required scenarios gate the build)
        run: >-
          python -m northcx.simulation examples/scenarios --specs examples --registry examples.support_agent:registry
          --skip-judge --record --source ci --meta commit=${{ github.sha }} --meta ref=${{ github.ref_name }}
        working-directory: src/backend
        env:
          NORTHCX_DATABASE_URL: postgresql://northcx:northcx@localhost:5432/northcx_test
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "22" }
      - run: npm ci
        working-directory: src/web
      - run: npm run typecheck
        working-directory: src/web
      - run: npm test
        working-directory: src/web
      - run: npm run build
        working-directory: src/web
  prototype:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "22" }
      - run: npm ci
        working-directory: src/prototype
      - run: npm run typecheck
        working-directory: src/prototype
      - run: npm test
        working-directory: src/prototype
  provenance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/check_restricted_paths.py
  stack:
    # Builds the real images and starts the whole stack exactly as the README describes.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Write a throwaway configuration
        run: |
          KEY=$(python3 -c "import secrets; print(secrets.token_urlsafe(32))")
          echo "::add-mask::$KEY"
          echo "KEY=$KEY" >> "$GITHUB_ENV"
          printf 'NORTHCX_DB_PASSWORD=ci%s\nNORTHCX_API_KEY=%s\nNORTHCX_DEMO=1\n' "$RANDOM$RANDOM" "$KEY" > .env
      - run: docker compose up -d --build --wait --wait-timeout 300
      - name: Smoke test
        run: |
          curl --fail --silent http://127.0.0.1:3000/ready
          curl --fail --silent --output /dev/null http://127.0.0.1:3001/
          for path in templates skills routing trace-export regression monitor/summary agents/support/environments; do
            curl --fail --silent --output /dev/null -H "authorization: Bearer $KEY" "http://127.0.0.1:3000/v1/$path" || { echo "FAILED: /v1/$path"; exit 1; }
          done
          curl --fail --silent --output /dev/null -H "authorization: Bearer $KEY" -H 'content-type: application/json' \
            -d '{"sessionId":"ci","message":"where is order 1042?"}' http://127.0.0.1:3000/v1/agents/support/chat
          test "$(curl --silent --output /dev/null --write-out '%{http_code}' http://127.0.0.1:3000/v1/agents)" = "401"
          curl --fail --silent -H "authorization: Bearer $KEY" http://127.0.0.1:3001/api/northcx/v1/me | grep -q '"role":"admin"'
          curl --fail --silent -X POST -H "authorization: Bearer $KEY" -H 'content-type: application/json' \
            -d '{"sessionId":"ci","message":"where is order 1042?"}' http://127.0.0.1:3000/v1/agents/support/chat | grep -q delivered
      - if: failure()
        run: docker compose logs --no-color
      - if: always()
        run: docker compose down -v

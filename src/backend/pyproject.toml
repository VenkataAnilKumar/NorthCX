[project]
name = "northcx"
version = "1.0.0rc2"
license = { text = "Apache-2.0" }
description = "NorthCX: open-source customer-experience agent platform built on the Claude API"
requires-python = ">=3.12"
dependencies = [
  "anthropic>=0.40",
  "fastapi>=0.115",
  "pydantic>=2.8",
  "uvicorn>=0.30",
  "websockets>=13",
  "pyyaml>=6",
  "httpx>=0.27",
  "sqlalchemy[asyncio]>=2.0.30",
  "asyncpg>=0.29",
  "alembic>=1.13",
  "cryptography>=43",
  "pypdf>=5",
  "mcp>=2.3,<3",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.24", "aiosmtpd>=1.4"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["northcx*"]

[tool.setuptools.package-data]
northcx = ["db/migrations/*.mako", "db/migrations/versions/*.py", "template_library/*.yaml", "template_library/*.json", "template_library/*.pub", "static/*.js"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]

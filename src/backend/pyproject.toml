[project]
name = "northcx"
version = "0.1.0"
description = "NorthCX: open-source customer-experience agent platform built on the Claude API"
requires-python = ">=3.12"
dependencies = [
  "anthropic>=0.40",
  "fastapi>=0.115",
  "pydantic>=2.8",
  "uvicorn>=0.30",
  "pyyaml>=6",
  "sqlalchemy[asyncio]>=2.0.30",
  "asyncpg>=0.29",
  "alembic>=1.13",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.24", "httpx>=0.27"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["northcx*"]

[tool.setuptools.package-data]
northcx = ["db/migrations/*.mako", "db/migrations/versions/*.py"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]

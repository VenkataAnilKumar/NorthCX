      NORTHCX_SSO_ROLE_CLAIM: ${NORTHCX_SSO_ROLE_CLAIM:-}
      NORTHCX_SSO_ROLE_MAP: ${NORTHCX_SSO_ROLE_MAP:-}
      NORTHCX_SSO_DEFAULT_ROLE: ${NORTHCX_SSO_DEFAULT_ROLE:-}
      NORTHCX_SSO_ALLOWED_DOMAINS: ${NORTHCX_SSO_ALLOWED_DOMAINS:-}
      NORTHCX_SSO_USE_GROUPS: ${NORTHCX_SSO_USE_GROUPS:-}
      NORTHCX_SSO_SESSION_HOURS: ${NORTHCX_SSO_SESSION_HOURS:-}
      NORTHCX_SSO_LANDING: ${NORTHCX_SSO_LANDING:-}
      NORTHCX_SUMMARIZE_AFTER_TOKENS: ${NORTHCX_SUMMARIZE_AFTER_TOKENS:-}
      NORTHCX_SUMMARY_MODEL: ${NORTHCX_SUMMARY_MODEL:-}
      NORTHCX_SMS_NUMBER: ${NORTHCX_SMS_NUMBER:-}
      NORTHCX_SMS_ACCOUNT_SID: ${NORTHCX_SMS_ACCOUNT_SID:-}
      NORTHCX_SMS_AUTH_TOKEN: ${NORTHCX_SMS_AUTH_TOKEN:-}
      NORTHCX_SMS_WEBHOOK_URL: ${NORTHCX_SMS_WEBHOOK_URL:-}
      NORTHCX_SMS_AGENT: ${NORTHCX_SMS_AGENT:-}

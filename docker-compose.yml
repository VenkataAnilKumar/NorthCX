      NORTHCX_WHATSAPP_PHONE_ID: ${NORTHCX_WHATSAPP_PHONE_ID:-}
      NORTHCX_WHATSAPP_TOKEN: ${NORTHCX_WHATSAPP_TOKEN:-}

# Development database. The full stack (backend, web) joins this file in Phase 2, sprint 12.
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: northcx
      POSTGRES_PASSWORD: northcx
      POSTGRES_DB: northcx
    ports: ["5432:5432"]
    volumes: ["northcx-pg:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U northcx"]
      interval: 5s
      retries: 10
volumes:
  northcx-pg:

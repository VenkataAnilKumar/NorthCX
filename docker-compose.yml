# The whole NorthCX stack: database, backend, web console.
#   cp .env.example .env     # then set the values marked REQUIRED
#   docker compose up -d --build --wait
# Console: http://localhost:3001   API: http://localhost:3000
# Everything is bound to 127.0.0.1 by default; put a TLS-terminating reverse proxy in front before exposing it.
name: northcx

services:
  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: northcx
      POSTGRES_DB: northcx
      POSTGRES_PASSWORD: ${NORTHCX_DB_PASSWORD:?Set NORTHCX_DB_PASSWORD in .env (letters and digits only)}
    volumes: ["northcx-pg:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U northcx -d northcx"]
      interval: 5s
      timeout: 3s
      retries: 20

  backend:
    build: ./src/backend
    image: northcx/backend:local
    restart: unless-stopped
    depends_on:
      postgres: { condition: service_healthy }
    environment:
      NORTHCX_DATABASE_URL: postgresql://northcx:${NORTHCX_DB_PASSWORD}@postgres:5432/northcx
      NORTHCX_API_KEY: ${NORTHCX_API_KEY:?Set NORTHCX_API_KEY in .env (a long random value)}
      NORTHCX_REQUIRE_AUTH: "1"
      NORTHCX_TOKEN_SECRET: ${NORTHCX_TOKEN_SECRET:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      NORTHCX_DEMO: ${NORTHCX_DEMO:-0}
      NORTHCX_APPROVAL_TTL_SECONDS: ${NORTHCX_APPROVAL_TTL_SECONDS:-}
      NORTHCX_WEBHOOK_URL: ${NORTHCX_WEBHOOK_URL:-}
      NORTHCX_WEBHOOK_SECRET: ${NORTHCX_WEBHOOK_SECRET:-}
      NORTHCX_EMAIL_FROM: ${NORTHCX_EMAIL_FROM:-}
      NORTHCX_SMTP_URL: ${NORTHCX_SMTP_URL:-}
      NORTHCX_EMAIL_AGENT: ${NORTHCX_EMAIL_AGENT:-}
      NORTHCX_EMAIL_FROM_NAME: ${NORTHCX_EMAIL_FROM_NAME:-}
      NORTHCX_EMAIL_TRUST_AUTH_RESULTS: ${NORTHCX_EMAIL_TRUST_AUTH_RESULTS:-}
      NORTHCX_EMAIL_MAX_REPLIES_PER_HOUR: ${NORTHCX_EMAIL_MAX_REPLIES_PER_HOUR:-}
      NORTHCX_MODEL_FALLBACKS: ${NORTHCX_MODEL_FALLBACKS:-}
      NORTHCX_MODEL_RETRIES: ${NORTHCX_MODEL_RETRIES:-}
      NORTHCX_MODEL_TIMEOUT: ${NORTHCX_MODEL_TIMEOUT:-}
      NORTHCX_DAILY_TOKEN_BUDGET: ${NORTHCX_DAILY_TOKEN_BUDGET:-}
      NORTHCX_RETENTION_DAYS: ${NORTHCX_RETENTION_DAYS:-}
      NORTHCX_SUMMARIZE_AFTER_TOKENS: ${NORTHCX_SUMMARIZE_AFTER_TOKENS:-}
      NORTHCX_SUMMARY_MODEL: ${NORTHCX_SUMMARY_MODEL:-}
      NORTHCX_SMS_NUMBER: ${NORTHCX_SMS_NUMBER:-}
      NORTHCX_SMS_ACCOUNT_SID: ${NORTHCX_SMS_ACCOUNT_SID:-}
      NORTHCX_SMS_AUTH_TOKEN: ${NORTHCX_SMS_AUTH_TOKEN:-}
      NORTHCX_SMS_WEBHOOK_URL: ${NORTHCX_SMS_WEBHOOK_URL:-}
      NORTHCX_SMS_AGENT: ${NORTHCX_SMS_AGENT:-}
      NORTHCX_SMS_MAX_REPLIES_PER_HOUR: ${NORTHCX_SMS_MAX_REPLIES_PER_HOUR:-}
      NORTHCX_ROUTING_FILE: ${NORTHCX_ROUTING_FILE:-}
      NORTHCX_INBOX_WEBHOOK_URL: ${NORTHCX_INBOX_WEBHOOK_URL:-}
      NORTHCX_INBOX_WEBHOOK_SECRET: ${NORTHCX_INBOX_WEBHOOK_SECRET:-}
      NORTHCX_PUBLIC_CONSOLE_URL: ${NORTHCX_PUBLIC_CONSOLE_URL:-}
      NORTHCX_CHATWOOT_URL: ${NORTHCX_CHATWOOT_URL:-}
      NORTHCX_CHATWOOT_ACCOUNT_ID: ${NORTHCX_CHATWOOT_ACCOUNT_ID:-}
      NORTHCX_CHATWOOT_INBOX_ID: ${NORTHCX_CHATWOOT_INBOX_ID:-}
      NORTHCX_CHATWOOT_TOKEN: ${NORTHCX_CHATWOOT_TOKEN:-}
      NORTHCX_LANGFUSE_URL: ${NORTHCX_LANGFUSE_URL:-}
      NORTHCX_LANGFUSE_PUBLIC_KEY: ${NORTHCX_LANGFUSE_PUBLIC_KEY:-}
      NORTHCX_LANGFUSE_SECRET_KEY: ${NORTHCX_LANGFUSE_SECRET_KEY:-}
      NORTHCX_OTLP_ENDPOINT: ${NORTHCX_OTLP_ENDPOINT:-}
      NORTHCX_OTLP_HEADERS: ${NORTHCX_OTLP_HEADERS:-}
      NORTHCX_TRACE_EXPORT_CONTENT: ${NORTHCX_TRACE_EXPORT_CONTENT:-}
      NORTHCX_TRACE_EXPORT_SAMPLE: ${NORTHCX_TRACE_EXPORT_SAMPLE:-}
      NORTHCX_ENVIRONMENT: ${NORTHCX_ENVIRONMENT:-}
      NORTHCX_STRICT_PROMOTION: ${NORTHCX_STRICT_PROMOTION:-}
      NORTHCX_RERUN_ON_KNOWLEDGE: ${NORTHCX_RERUN_ON_KNOWLEDGE:-}
      NORTHCX_RERUN_DEBOUNCE_SECONDS: ${NORTHCX_RERUN_DEBOUNCE_SECONDS:-}
      NORTHCX_MEMORY: ${NORTHCX_MEMORY:-}
      NORTHCX_CONTEXT_PROVIDER: ${NORTHCX_CONTEXT_PROVIDER:-}
      NORTHCX_CONTEXT_URL: ${NORTHCX_CONTEXT_URL:-}
      NORTHCX_CONTEXT_SECRET: ${NORTHCX_CONTEXT_SECRET:-}
      NORTHCX_CONTEXT_TTL_SECONDS: ${NORTHCX_CONTEXT_TTL_SECONDS:-}
      NORTHCX_CONTEXT_TIMEOUT: ${NORTHCX_CONTEXT_TIMEOUT:-}
    # To keep secrets out of the environment, mount files and use the *_FILE variants instead, for example:
    #   environment: { NORTHCX_API_KEY_FILE: /run/secrets/northcx_api_key }   (and remove NORTHCX_API_KEY)
    #   secrets: [northcx_api_key]
    ports: ["${NORTHCX_BIND:-127.0.0.1}:${NORTHCX_BACKEND_PORT:-3000}:3000"]

  web:
    build:
      context: ./src/web
      args:
        NORTHCX_API_URL: http://backend:3000
    image: northcx/web:local
    restart: unless-stopped
    depends_on:
      backend: { condition: service_healthy }
    ports: ["${NORTHCX_BIND:-127.0.0.1}:${NORTHCX_WEB_PORT:-3001}:3001"]

volumes:
  northcx-pg:

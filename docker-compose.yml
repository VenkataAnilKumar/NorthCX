      NORTHCX_WHATSAPP_OPTIN_FILE: ${NORTHCX_WHATSAPP_OPTIN_FILE:-}
      NORTHCX_TELEGRAM_TOKEN: ${NORTHCX_TELEGRAM_TOKEN:-}
      NORTHCX_TELEGRAM_SECRET: ${NORTHCX_TELEGRAM_SECRET:-}
      NORTHCX_TELEGRAM_AGENT: ${NORTHCX_TELEGRAM_AGENT:-}
      NORTHCX_TELEGRAM_MAX_REPLIES_PER_HOUR: ${NORTHCX_TELEGRAM_MAX_REPLIES_PER_HOUR:-}
      NORTHCX_TELEGRAM_API_URL: ${NORTHCX_TELEGRAM_API_URL:-}
      NORTHCX_ROUTING_FILE: ${NORTHCX_ROUTING_FILE:-}
      NORTHCX_INBOX_WEBHOOK_URL: ${NORTHCX_INBOX_WEBHOOK_URL:-}
      NORTHCX_INBOX_WEBHOOK_SECRET: ${NORTHCX_INBOX_WEBHOOK_SECRET:-}
      NORTHCX_PUBLIC_CONSOLE_URL: ${NORTHCX_PUBLIC_CONSOLE_URL:-}
      NORTHCX_CHATWOOT_URL: ${NORTHCX_CHATWOOT_URL:-}
      NORTHCX_CHATWOOT_ACCOUNT_ID: ${NORTHCX_CHATWOOT_ACCOUNT_ID:-}
      NORTHCX_CHATWOOT_INBOX_ID: ${NORTHCX_CHATWOOT_INBOX_ID:-}
      NORTHCX_CHATWOOT_TOKEN: ${NORTHCX_CHATWOOT_TOKEN:-}
      NORTHCX_LANGFUSE_URL: ${NORTHCX_LANGFUSE_URL:-}
      NORTHCX_LANGFUSE_PUBLIC_KEY: ${NORTHCX_LANGFUSE_PUBLIC_KEY:-}
      NORTHCX_LANGFUSE_SECRET_KEY: ${NORTHCX_LANGFUSE_SECRET_KEY:-}
      NORTHCX_OTLP_ENDPOINT: ${NORTHCX_OTLP_ENDPOINT:-}
      NORTHCX_OTLP_HEADERS: ${NORTHCX_OTLP_HEADERS:-}
      NORTHCX_TRACE_EXPORT_CONTENT: ${NORTHCX_TRACE_EXPORT_CONTENT:-}
      NORTHCX_TRACE_EXPORT_SAMPLE: ${NORTHCX_TRACE_EXPORT_SAMPLE:-}
      NORTHCX_ENVIRONMENT: ${NORTHCX_ENVIRONMENT:-}
      NORTHCX_STRICT_PROMOTION: ${NORTHCX_STRICT_PROMOTION:-}
      NORTHCX_RELEASE_APPROVALS: ${NORTHCX_RELEASE_APPROVALS:-}
      NORTHCX_SCIM_TOKEN: ${NORTHCX_SCIM_TOKEN:-}
      NORTHCX_SCIM_REQUIRE_PROVISIONED: ${NORTHCX_SCIM_REQUIRE_PROVISIONED:-}
      NORTHCX_RERUN_ON_KNOWLEDGE: ${NORTHCX_RERUN_ON_KNOWLEDGE:-}
      NORTHCX_RERUN_DEBOUNCE_SECONDS: ${NORTHCX_RERUN_DEBOUNCE_SECONDS:-}
      NORTHCX_SKILLS_DIR: ${NORTHCX_SKILLS_DIR:-}
      NORTHCX_CONNECTORS_DIR: ${NORTHCX_CONNECTORS_DIR:-}
      NORTHCX_CONNECTOR_HOSTS: ${NORTHCX_CONNECTOR_HOSTS:-}
      NORTHCX_TEMPLATES_DIR: ${NORTHCX_TEMPLATES_DIR:-}
      NORTHCX_REGISTRY: ${NORTHCX_REGISTRY:-}
      NORTHCX_AGENTS_DIR: ${NORTHCX_AGENTS_DIR:-}
      NORTHCX_SCENARIOS_DIR: ${NORTHCX_SCENARIOS_DIR:-}
      NORTHCX_RATE_LIMITS: ${NORTHCX_RATE_LIMITS:-}
      NORTHCX_RATE_LIMIT_PER_MINUTE: ${NORTHCX_RATE_LIMIT_PER_MINUTE:-}
      NORTHCX_CHAT_PER_SESSION_PER_MINUTE: ${NORTHCX_CHAT_PER_SESSION_PER_MINUTE:-}
      NORTHCX_AUTH_FAILURES_PER_MINUTE: ${NORTHCX_AUTH_FAILURES_PER_MINUTE:-}
      NORTHCX_ALERTS: ${NORTHCX_ALERTS:-}
      NORTHCX_ALERT_RULES: ${NORTHCX_ALERT_RULES:-}
      NORTHCX_ALERT_WEBHOOK_URL: ${NORTHCX_ALERT_WEBHOOK_URL:-}
      NORTHCX_ALERT_WEBHOOK_SECRET: ${NORTHCX_ALERT_WEBHOOK_SECRET:-}
      NORTHCX_PRICE_PER_MILLION_TOKENS: ${NORTHCX_PRICE_PER_MILLION_TOKENS:-}
      NORTHCX_MEMORY: ${NORTHCX_MEMORY:-}
      NORTHCX_CONTEXT_PROVIDER: ${NORTHCX_CONTEXT_PROVIDER:-}
      NORTHCX_CONTEXT_URL: ${NORTHCX_CONTEXT_URL:-}
      NORTHCX_CONTEXT_SECRET: ${NORTHCX_CONTEXT_SECRET:-}
      NORTHCX_CONTEXT_TTL_SECONDS: ${NORTHCX_CONTEXT_TTL_SECONDS:-}
      NORTHCX_CONTEXT_TIMEOUT: ${NORTHCX_CONTEXT_TIMEOUT:-}
    # To keep secrets out of the environment, mount files and use the *_FILE variants instead, for example:
    #   environment: { NORTHCX_API_KEY_FILE: /run/secrets/northcx_api_key }   (and remove NORTHCX_API_KEY)
    #   secrets: [northcx_api_key]
    ports: ["${NORTHCX_BIND:-127.0.0.1}:${NORTHCX_BACKEND_PORT:-3000}:3000"]

  web:
    build:
      context: ./src
      dockerfile: apps/studio/Dockerfile
      args:
        NORTHCX_API_URL: http://backend:3000
    image: northcx/web:local
    restart: unless-stopped
    depends_on:
      backend: { condition: service_healthy }
    ports: ["${NORTHCX_BIND:-127.0.0.1}:${NORTHCX_WEB_PORT:-3001}:3001"]

  workspace:
    build:
      context: ./src
      dockerfile: apps/workspace/Dockerfile
      args:
        NORTHCX_API_URL: http://backend:3000
    image: northcx/workspace:local
    restart: unless-stopped
    depends_on:
      backend: { condition: service_healthy }
    ports: ["${NORTHCX_BIND:-127.0.0.1}:${NORTHCX_WORKSPACE_PORT:-3002}:3002"]

volumes:
  northcx-pg:

# The whole NorthCX stack: database, backend, web console.
#   cp .env.example .env     # then set the values marked REQUIRED
#   docker compose up -d --build --wait
# Admin console: http://localhost:3001   Workspace: http://localhost:3002   API: http://localhost:3000
# Everything is bound to 127.0.0.1 by default; put a TLS-terminating reverse proxy in front before exposing it.
name: northcx

services:
  postgres:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_USER: northcx
      POSTGRES_DB: northcx
      POSTGRES_PASSWORD: ${NORTHCX_DB_PASSWORD:?Set NORTHCX_DB_PASSWORD in .env (letters and digits only)}
    volumes: ["northcx-pg:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U northcx -d northcx"]
      interval: 5s
      timeout: 3s
      retries: 20

  backend:
    build: ./src/backend
    image: northcx/backend:local
    restart: unless-stopped
    depends_on:
      postgres: { condition: service_healthy }
    environment:
      NORTHCX_DATABASE_URL: postgresql://northcx:${NORTHCX_DB_PASSWORD}@postgres:5432/northcx
      NORTHCX_API_KEY: ${NORTHCX_API_KEY:?Set NORTHCX_API_KEY in .env (a long random value)}
      NORTHCX_REQUIRE_AUTH: "1"
      NORTHCX_TOKEN_SECRET: ${NORTHCX_TOKEN_SECRET:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      NORTHCX_DEMO: ${NORTHCX_DEMO:-0}
      NORTHCX_APPROVAL_TTL_SECONDS: ${NORTHCX_APPROVAL_TTL_SECONDS:-}
      NORTHCX_WEBHOOK_URL: ${NORTHCX_WEBHOOK_URL:-}
      NORTHCX_WEBHOOK_SECRET: ${NORTHCX_WEBHOOK_SECRET:-}
      NORTHCX_EMAIL_FROM: ${NORTHCX_EMAIL_FROM:-}
      NORTHCX_SMTP_URL: ${NORTHCX_SMTP_URL:-}
      NORTHCX_EMAIL_AGENT: ${NORTHCX_EMAIL_AGENT:-}
      NORTHCX_EMAIL_FROM_NAME: ${NORTHCX_EMAIL_FROM_NAME:-}
      NORTHCX_EMAIL_TRUST_AUTH_RESULTS: ${NORTHCX_EMAIL_TRUST_AUTH_RESULTS:-}
      NORTHCX_EMAIL_MAX_REPLIES_PER_HOUR: ${NORTHCX_EMAIL_MAX_REPLIES_PER_HOUR:-}
      NORTHCX_MODEL_FALLBACKS: ${NORTHCX_MODEL_FALLBACKS:-}
      NORTHCX_MODEL_RETRIES: ${NORTHCX_MODEL_RETRIES:-}
      NORTHCX_MODEL_TIMEOUT: ${NORTHCX_MODEL_TIMEOUT:-}
      NORTHCX_DAILY_TOKEN_BUDGET: ${NORTHCX_DAILY_TOKEN_BUDGET:-}
      NORTHCX_DAILY_BUDGET: ${NORTHCX_DAILY_BUDGET:-}
      NORTHCX_BUDGET_CURRENCY: ${NORTHCX_BUDGET_CURRENCY:-USD}
      NORTHCX_PROVIDERS_FILE: ${NORTHCX_PROVIDERS_FILE:-}
      NORTHCX_ROUTING_RULES_FILE: ${NORTHCX_ROUTING_RULES_FILE:-}
      NORTHCX_LIMITS_BACKEND: ${NORTHCX_LIMITS_BACKEND:-}
      NORTHCX_ROLE: ${NORTHCX_ROLE:-}
      NORTHCX_ANTHROPIC_CLIENT: ${NORTHCX_ANTHROPIC_CLIENT:-}
      NORTHCX_RESOLUTION_WINDOW_DAYS: ${NORTHCX_RESOLUTION_WINDOW_DAYS:-}
      NORTHCX_RETENTION_DAYS: ${NORTHCX_RETENTION_DAYS:-}
      NORTHCX_ASSIST: ${NORTHCX_ASSIST:-}
      NORTHCX_CRAWL_HOSTS: ${NORTHCX_CRAWL_HOSTS:-}
      NORTHCX_RESIDENCY_FILE: ${NORTHCX_RESIDENCY_FILE:-}
      NORTHCX_VERIFY: ${NORTHCX_VERIFY:-}
      NORTHCX_VERIFY_VALID_MINUTES: ${NORTHCX_VERIFY_VALID_MINUTES:-}
      NORTHCX_EVENTS_WEBHOOK_URL: ${NORTHCX_EVENTS_WEBHOOK_URL:-}
      NORTHCX_EVENTS_WEBHOOK_SECRET: ${NORTHCX_EVENTS_WEBHOOK_SECRET:-}
      NORTHCX_EVENTS: ${NORTHCX_EVENTS:-}
      NORTHCX_TRANSCRIBE_URL: ${NORTHCX_TRANSCRIBE_URL:-}
      NORTHCX_TRANSCRIBE_MODEL: ${NORTHCX_TRANSCRIBE_MODEL:-}
      NORTHCX_TRANSCRIBE_API_KEY: ${NORTHCX_TRANSCRIBE_API_KEY:-}
      NORTHCX_CRAWL_ALLOW_PRIVATE: ${NORTHCX_CRAWL_ALLOW_PRIVATE:-}
      NORTHCX_EMBEDDINGS_URL: ${NORTHCX_EMBEDDINGS_URL:-}
      NORTHCX_EMBEDDINGS_MODEL: ${NORTHCX_EMBEDDINGS_MODEL:-}
      NORTHCX_EMBEDDINGS_API_KEY: ${NORTHCX_EMBEDDINGS_API_KEY:-}
      NORTHCX_EMBEDDINGS_DIMENSIONS: ${NORTHCX_EMBEDDINGS_DIMENSIONS:-}
      NORTHCX_EMBEDDINGS_SOURCE_MODELS: ${NORTHCX_EMBEDDINGS_SOURCE_MODELS:-}
      NORTHCX_ANN_THRESHOLD: ${NORTHCX_ANN_THRESHOLD:-}
      NORTHCX_CHANNEL_RATE_LIMIT_PER_MINUTE: ${NORTHCX_CHANNEL_RATE_LIMIT_PER_MINUTE:-}
      NORTHCX_DB_POOL_SIZE: ${NORTHCX_DB_POOL_SIZE:-}
      NORTHCX_VOICE_AGENT: ${NORTHCX_VOICE_AGENT:-}
      NORTHCX_VOICE_BRAND: ${NORTHCX_VOICE_BRAND:-}
      NORTHCX_VOICE_LANGUAGE: ${NORTHCX_VOICE_LANGUAGE:-}
      NORTHCX_VOICE_RECORDING: ${NORTHCX_VOICE_RECORDING:-}
      NORTHCX_VOICE_TRANSFER: ${NORTHCX_VOICE_TRANSFER:-}
      NORTHCX_VOICE_TRUST_CALLER_ID: ${NORTHCX_VOICE_TRUST_CALLER_ID:-}
      NORTHCX_CORS_ORIGINS: ${NORTHCX_CORS_ORIGINS:-}
